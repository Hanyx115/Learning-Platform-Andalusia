services:
  api:
    image: ${API_IMAGE:?Set API_IMAGE to an immutable release image}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__DefaultConnection: ${CONNECTION_STRING:?Supply the database connection from a secret store}
      Jwt__Key: ${JWT_KEY:?Supply the JWT signing key from a secret store}
      CourseAssistant__Provider: ${COURSE_ASSISTANT_PROVIDER:-Demo}
      CourseAssistant__OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      AllowedHosts: ${ALLOWED_HOSTS:?Set the production API host}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN:?Set the HTTPS web origin}
      Database__MigrateOnStartup: "false"
      CatalogSeed__Enabled: "false"
      IdentitySeed__Enabled: "false"
      Notifications__ProcessingEnabled: "true"
      HttpsRedirection__Enabled: "true"
      AssignmentSubmissions__StoragePath: "/home/app/assignment-submissions"
      CourseMaterials__StoragePath: "/home/app/course-materials"
      CatalogImages__StoragePath: "/home/app/catalog-images"
    ports:
      - "${API_HTTP_PORT:-8080}:8080"
    volumes:
      - api-dataprotection-keys:/home/app/.aspnet/DataProtection-Keys
      - assignment-submissions:/home/app/assignment-submissions
      - course-materials:/home/app/course-materials
      - catalog-images:/home/app/catalog-images

  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE to an immutable release image}
    restart: unless-stopped
    ports:
      - "${WEB_HTTP_PORT:-8081}:8080"

volumes:
  api-dataprotection-keys:
  assignment-submissions:
  course-materials:
  catalog-images:
